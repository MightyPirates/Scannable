architectury = "19.0.1"

fabric-loader = "0.18.2"
fabric-api = "0.141.6+1.21.11"

fabric-forgeConfigPort = "21.11.1"

neoforge-platform = "21.11.42"
neoforge-loader = "1"

[plugins]
loom = { id = "dev.architectury.loom", version = "1.13-SNAPSHOT" }
architectury = { id = "architectury-plugin", version = "3.4-SNAPSHOT" }
shadow = { id = "com.gradleup.shadow", version = "9.4.1" }
